services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://library:library_password@postgres:5432/library
      APP_DATA_DIR: /data
      APP_BASE_URL: http://localhost:3000
      APP_CONTACT_EMAIL: replace-me@example.com
      GOOGLE_BOOKS_API_KEY: ""
      ISBNDB_API_KEY: ""
      HARDCOVER_API_TOKEN: ""
      HARDCOVER_API_TOKEN_FILE: ""
      ENABLE_OCR: "true"
      ENABLE_3D: "true"
      BLENDER_MODEL_PATH: /models/home-library.glb
    ports:
      - "3000:3000"
    volumes:
      - library-data:/data

volumes:
  postgres-data:
  library-data:
